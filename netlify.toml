[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite emits hashed files under /assets/* (JS, CSS, and imported images).
# Content-addressed names make these safe to cache forever; a new file is a
# new URL. Brucey is still preloaded on idle so the offline modal can paint
# him from cache when the network is already gone.
[[headers]]
  for = "/assets/*"
[headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
